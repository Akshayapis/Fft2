name: Build & test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run integration & security tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-only-secret-value-123456

  user-app-build:
    name: User app production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: user-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: user-app-dist
          path: user-app/dist
          retention-days: 7

  admin-app-build:
    name: Admin app production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-app-dist
          path: admin-app/dist
          retention-days: 7

  live-stack-smoke:
    name: Live stack smoke test
    runs-on: ubuntu-latest
    needs: [backend-tests, user-app-build, admin-app-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm --prefix backend ci
          npm --prefix user-app ci
          npm --prefix admin-app ci
      - name: Start backend and both frontends
        run: |
          mkdir -p /tmp/logs
          (cd backend && DATA_FILE=/tmp/arena-smoke.json nohup node src/server.js > /tmp/logs/backend.log 2>&1 &)
          (cd user-app && nohup npm run dev > /tmp/logs/user.log 2>&1 &)
          (cd admin-app && nohup npm run dev > /tmp/logs/admin.log 2>&1 &)
          for port in 4000 5173 5174; do
            for i in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:$port/" > /dev/null 2>&1; then break; fi
              if [ "$port" = "4000" ] && curl -fsS "http://127.0.0.1:4000/api/health" > /dev/null 2>&1; then break; fi
              sleep 2
            done
          done
      - name: Run smoke test
        run: node scripts/smoke-test.mjs
      - name: Print logs on failure
        if: failure()
        run: tail -80 /tmp/logs/*.log

  package:
    name: Package deliverable ZIP
    runs-on: ubuntu-latest
    needs: [backend-tests, user-app-build, admin-app-build]
    steps:
      - uses: actions/checkout@v4
      - name: Create ZIP
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fire-arena-platform
          path: artifacts/*.zip
          retention-days: 30
